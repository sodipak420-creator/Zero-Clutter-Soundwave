cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice Comment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 28px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    .status {
      font-size: 13px;
      color: #8b949e;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 64px;
      margin-bottom: 30px;
    }
    .bar {
      width: 4px;
      height: 8px;
      background: #388bfd;
      border-radius: 4px;
      transition: height 0.1s ease;
    }
    .btn-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      transition: transform 0.1s ease;
    }
    .btn-circle:active { transform: scale(0.94); }
    .btn-record { background: #da3633; box-shadow: 0 4px 20px rgba(218, 54, 51, 0.4); }
    .btn-play { background: #238636; box-shadow: 0 4px 20px rgba(35, 134, 54, 0.4); }
    .btn-circle svg { width: 30px; height: 30px; fill: white; }
    
    .btn-action {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status" id="statusText">Tap to Record Voice</div>
    <div class="wave-container" id="waveContainer"></div>

    <button class="btn-circle btn-record" id="mainBtn" onclick="handleMainAction()">
      <svg id="btnIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>

    <div id="actionArea" style="display: none;">
      <button class="btn-action" onclick="copyShareLink()">📋 Copy Link for Comment</button>
      <button class="btn-action" style="background: transparent; border: none; color: #8b949e;" onclick="resetRecorder()">Record Again</button>
    </div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    const statusText = document.getElementById('statusText');
    const mainBtn = document.getElementById('mainBtn');
    const btnIcon = document.getElementById('btnIcon');
    const actionArea = document.getElementById('actionArea');
    const audioElement = document.getElementById('audioElement');
    const waveContainer = document.getElementById('waveContainer');

    const bars = [];
    for (let i = 0; i < 26; i++) {
      const b = document.createElement('div');
      b.className = 'bar';
      waveContainer.appendChild(b);
      bars.push(b);
    }

    let waveTimer = null;
    function setWavesActive(active) {
      if (active) {
        waveTimer = setInterval(() => {
          bars.forEach(b => b.style.height = `${Math.floor(Math.random() * 52) + 8}px`);
        }, 100);
      } else {
        clearInterval(waveTimer);
        bars.forEach(b => b.style.height = '8px');
      }
    }

    let mediaRecorder;
    let audioChunks = [];
    let state = "IDLE";

    async function handleMainAction() {
      if (state === "IDLE") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            audioElement.src = URL.createObjectURL(audioBlob);
            state = "RECORDED";
            statusText.innerText = "Voice Recorded!";
            mainBtn.className = "btn-circle btn-play";
            btnIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            actionArea.style.display = "block";
            setWavesActive(false);
          };

          mediaRecorder.start();
          state = "RECORDING";
          statusText.innerText = "Recording... Tap to Stop";
          btnIcon.innerHTML = '<path d="M6 6h12v12H6z"/>';
          setWavesActive(true);
        } catch (err) {
          alert("Microphone permission required: " + err.message);
        }
      } else if (state === "RECORDING") {
        mediaRecorder.stop();
      } else if (state === "RECORDED") {
        audioElement.play();
        state = "PLAYING";
        statusText.innerText = "Playing...";
        btnIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        setWavesActive(true);
      } else if (state === "PLAYING") {
        audioElement.pause();
        state = "RECORDED";
        statusText.innerText = "Paused";
        btnIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        setWavesActive(false);
      }
    }

    audioElement.onended = () => {
      state = "RECORDED";
      statusText.innerText = "Playback Finished";
      btnIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      setWavesActive(false);
    };

    function resetRecorder() {
      state = "IDLE";
      audioElement.src = "";
      statusText.innerText = "Tap to Record Voice";
      mainBtn.className = "btn-circle btn-record";
      btnIcon.innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>';
      actionArea.style.display = "none";
      setWavesActive(false);
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied! Paste it in comments.");
    }
  </script>
</body>
</html>
EOF
